<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Flag Racer - Grand Prix Track</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>" />
  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #15803d 0%, #166534 60%, #14532d 100%);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      color: #0f172a;
    }

    /* Track SVG Styles */
    .track-asphalt {
      stroke: #1e293b;
      fill: none;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .track-kerb-white {
      stroke: #ffffff;
      fill: none;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .track-kerb-red {
      stroke: #ef4444;
      fill: none;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 20 20;
    }

    .track-centerline {
      stroke: #facc15;
      fill: none;
      stroke-width: 3.5;
      stroke-dasharray: 18 16;
      stroke-linecap: round;
      opacity: 0.9;
    }

    /* Flag card frame */
    .flag-card-shadow {
      box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.18), 0 6px 12px -2px rgba(0, 0, 0, 0.1);
    }

    .flag-svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 0.85rem;
    }

    .flag-svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 0.75rem;
      border: 2px solid rgba(0, 0, 0, 0.1);
    }

    /* Massive Touch Buttons */
    .btn-option {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .btn-option:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* Shake on Incorrect */
    @keyframes carCrashWobble {
      0%, 100% { transform: translate(-29px, -16px) rotate(0deg) scale(1); }
      20% { transform: translate(-33px, -14px) rotate(-10deg) scale(1.08); }
      40% { transform: translate(-25px, -18px) rotate(10deg) scale(1.08); }
      60% { transform: translate(-31px, -16px) rotate(-5deg) scale(1.04); }
      80% { transform: translate(-27px, -16px) rotate(5deg) scale(1.02); }
    }

    .car-skid-anim {
      animation: carCrashWobble 0.45s ease-in-out;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .shake-anim {
      animation: gentleShake 0.4s ease-in-out;
    }

    /* Car Boost Flames Animation */
    @keyframes exhaustFlicker {
      0%, 100% { transform: scaleX(1) scaleY(1); opacity: 0.95; }
      50% { transform: scaleX(1.4) scaleY(1.2); opacity: 1; }
    }

    #car-flames:not(.hidden) {
      animation: exhaustFlicker 0.12s infinite alternate;
    }

    /* Speed lines streak */
    @keyframes speedStreak {
      0% { opacity: 0; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(-10px); }
      100% { opacity: 0; transform: translateX(-24px); }
    }

    #car-speed-streak:not(.hidden) {
      animation: speedStreak 0.2s infinite linear;
    }

    /* Confetti Particle */
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .confetti-piece {
      position: absolute;
      width: 12px;
      height: 18px;
      top: -20px;
      border-radius: 3px;
      animation: confettiFall 2.8s ease-out forwards;
      pointer-events: none;
      z-index: 60;
    }

    /* Trophy Bounce */
    @keyframes trophyBounce {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-16px) rotate(3deg) scale(1.06); }
    }

    .trophy-anim {
      animation: trophyBounce 1.5s ease-in-out infinite;
    }

    /* Finish Line Gantry Celebration Glow */
    @keyframes gantryGlow {
      0%, 100% { filter: drop-shadow(0 0 6px #facc15); opacity: 0.95; }
      50% { filter: drop-shadow(0 0 24px #f59e0b) drop-shadow(0 0 40px #ffffff); opacity: 1; }
    }

    .gantry-celebrate {
      animation: gantryGlow 0.4s ease-in-out infinite;
    }

    /* Celebratory Fireworks */
    .firework-spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px currentColor;
      animation: fireworkSpark 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes fireworkSpark {
      0% { transform: translate(0, 0) scale(1.5); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
    }

    /* Compact & Short Screen (Landscape) Adaptations to Guarantee Zero Scroll */
    @media (max-height: 540px) {
      #game-card {
        padding: 0.5rem 0.85rem !important;
        max-height: 85vh !important;
      }
      #question-container {
        flex-direction: row !important;
        gap: 0.75rem !important;
        align-items: center !important;
      }
      #prompt-left-col {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        flex-shrink: 0 !important;
      }
      #prompt-label {
        font-size: 0.85rem !important;
        margin-bottom: 0.25rem !important;
      }
      #prompt-content {
        min-height: auto !important;
        margin-bottom: 0 !important;
      }
      #prompt-content .flag-card-shadow {
        width: 110px !important;
        height: 70px !important;
      }
      #options-container {
        flex: 1 !important;
        flex-direction: column !important;
        gap: 0.3rem !important;
      }
      .btn-option {
        min-height: 40px !important;
        padding: 0.2rem 0.5rem !important;
        font-size: 0.9rem !important;
      }
      .btn-option .flag-svg-container {
        height: 38px !important;
      }
      #feedback-bar {
        height: 1.5rem !important;
        font-size: 0.85rem !important;
      }
    }
  </style>
</head>
<body class="w-full h-full relative select-none">

  <!-- ==========================================================================
       1. RACE CIRCUIT SVG LAYER (Surrounds the entire screen)
       ========================================================================== -->
  <svg id="circuit-svg" class="absolute inset-0 w-full h-full pointer-events-none z-10" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Checkered Start/Finish Pattern -->
      <pattern id="checkered-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="#ffffff" />
        <rect x="8" width="8" height="8" fill="#0f172a" />
        <rect y="8" width="8" height="8" fill="#0f172a" />
        <rect x="8" y="8" width="8" height="8" fill="#ffffff" />
      </pattern>
    </defs>

    <!-- Invisible math path for getPointAtLength() -->
    <path id="track-path" fill="none" stroke="none" />

    <!-- Outer & Inner Rumble Strip Curbs (White base + Red dashed overlay) -->
    <path id="track-border-outer" class="track-kerb-white" />
    <path id="track-kerb-red" class="track-kerb-red" />

    <!-- Dark Asphalt Road -->
    <path id="track-asphalt" class="track-asphalt" />

    <!-- Yellow Dashed Racing Centerline -->
    <path id="track-centerline" class="track-centerline" />

    <!-- Start / Finish Line Banner & Checkered Grid -->
    <g id="start-finish-group"></g>

    <!-- RACECAR SPRITE (Directly in SVG for 100% Shared Coordinate Space with Track Path) -->
    <g id="race-car-group" style="will-change: transform; pointer-events: none;">
      <g id="car-visuals" transform="translate(-29, -16)">
        
        <!-- Speed lines behind car when boosting -->
        <g id="car-speed-streak" class="hidden">
          <line x1="-12" y1="10" x2="-2" y2="10" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" />
          <line x1="-18" y1="16" x2="-5" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
          <line x1="-13" y1="22" x2="-3" y2="22" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" />
        </g>

        <!-- Twin Boost Exhaust Flames -->
        <g id="car-flames" class="hidden">
          <path d="M 3 10 Q -10 10 -15 8 Q -8 11 -3 12 Z" fill="#f97316" />
          <path d="M 3 10 Q -6 10 -10 9 Q -5 11 -3 11.5 Z" fill="#facc15" />
          <path d="M 3 22 Q -10 22 -15 24 Q -8 21 -3 20 Z" fill="#f97316" />
          <path d="M 3 22 Q -6 22 -10 23 Q -5 21 -3 20.5 Z" fill="#facc15" />
        </g>

        <!-- Skid Smoke Puff on Crash -->
        <g id="car-skid-smoke" class="hidden">
          <circle cx="2" cy="8" r="6" fill="rgba(255,255,255,0.7)" />
          <circle cx="-3" cy="16" r="8" fill="rgba(255,255,255,0.8)" />
          <circle cx="2" cy="24" r="6" fill="rgba(255,255,255,0.7)" />
        </g>

        <!-- 4 Wide Racing Tires -->
        <!-- Front Top Tire -->
        <rect x="36" y="1" width="12" height="5.5" rx="2" fill="#111827" stroke="#374151" stroke-width="0.8" />
        <circle cx="42" cy="3.7" r="1.2" fill="#9ca3af" />
        <!-- Front Bottom Tire -->
        <rect x="36" y="25.5" width="12" height="5.5" rx="2" fill="#111827" stroke="#374151" stroke-width="0.8" />
        <circle cx="42" cy="28.2" r="1.2" fill="#9ca3af" />
        <!-- Rear Top Tire -->
        <rect x="6" y="0.5" width="14" height="6.5" rx="2" fill="#111827" stroke="#374151" stroke-width="0.8" />
        <circle cx="13" cy="3.7" r="1.5" fill="#9ca3af" />
        <!-- Rear Bottom Tire -->
        <rect x="6" y="25" width="14" height="6.5" rx="2" fill="#111827" stroke="#374151" stroke-width="0.8" />
        <circle cx="13" cy="28.2" r="1.5" fill="#9ca3af" />

        <!-- Rear Wing Spoiler -->
        <rect x="2" y="3" width="6" height="26" rx="1.5" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.8" />
        <path d="M 8 8 L 13 11 L 13 21 L 8 24 Z" fill="#b91c1c" />

        <!-- Aerodynamic Main Chassis / Body (Vibrant Racing Red) -->
        <path d="M 5 7 Q 24 7 40 10 Q 53 13 57 16 Q 53 19 40 22 Q 24 25 5 25 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />

        <!-- Front Wing / Nose Splitter -->
        <path d="M 52 6 L 57 16 L 52 26 L 49 23 L 53 16 L 49 9 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.8" />

        <!-- White & Yellow Racing Stripe -->
        <path d="M 10 13.5 L 54 13.5 L 55 16 L 54 18.5 L 10 18.5 Z" fill="#ffffff" opacity="0.9" />
        <path d="M 12 14.8 L 52 14.8 L 53 16 L 52 17.2 L 12 17.2 Z" fill="#facc15" />

        <!-- Racing #1 Badge -->
        <circle cx="23" cy="16" r="4.2" fill="#ffffff" stroke="#991b1b" stroke-width="0.8" />
        <text x="23" y="19" font-size="7.5" font-family="'Nunito', sans-serif" font-weight="900" fill="#dc2626" text-anchor="middle">1</text>

        <!-- Cockpit & Driver Helmet with Shiny Visor -->
        <ellipse cx="33" cy="16" rx="6.5" ry="4.5" fill="#1e293b" />
        <!-- Pilot Helmet (Bright Yellow with smile) -->
        <circle cx="32" cy="16" r="3.5" fill="#fbbf24" stroke="#d97706" stroke-width="0.7" />
        <!-- Dark Blue Racing Visor -->
        <path d="M 32 14 Q 35.5 16 32 18 Q 33.5 16 32 14 Z" fill="#0284c7" />
      </g>
    </g>
  </svg>

  <!-- ==========================================================================
       2. CELEBRATORY FINISH BANNER & FIREWORKS OVERLAY
       ========================================================================== -->
  <div id="fireworks-container" class="fixed inset-0 pointer-events-none z-40 overflow-hidden"></div>
  <div id="finish-banner" class="fixed top-6 sm:top-10 left-1/2 -translate-x-1/2 bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 border-4 border-slate-900 rounded-3xl px-5 sm:px-8 py-2.5 sm:py-3.5 shadow-2xl flex items-center gap-2 sm:gap-3 scale-0 transition-transform duration-500 z-40 pointer-events-none">
    <span class="text-2xl sm:text-4xl animate-bounce">🏁</span>
    <span class="text-base sm:text-2xl font-black text-slate-900 uppercase tracking-wider">Finish Line Champion!</span>
    <span class="text-2xl sm:text-4xl animate-bounce">🏁</span>
  </div>

  <!-- ==========================================================================
       3. CENTER ARENA (Guaranteed 100% Fullscreen Fit, No Scrolling)
       ========================================================================== -->
  <div id="center-arena" class="absolute inset-0 flex items-center justify-center pointer-events-none z-30 p-12 sm:p-14 md:p-16">
    
    <!-- Central Game Card -->
    <div id="game-card" class="pointer-events-auto w-full max-w-xl max-h-[88vh] sm:max-h-[82vh] bg-white/95 backdrop-blur-md rounded-3xl p-3.5 sm:p-5 shadow-2xl border-4 border-slate-900 flex flex-col justify-between items-center text-center transition-all overflow-hidden">
      
      <!-- Top HUD: Flag Icon, Progress Meter Bar, Music & SFX Controls -->
      <div class="w-full flex items-center justify-between gap-2 border-b-2 border-slate-200 pb-2 mb-2">
        
        <!-- Race Car Icon -->
        <div class="flex items-center gap-1.5">
          <span class="text-xl sm:text-2xl animate-pulse">🏎️</span>
        </div>

        <!-- Progress Meter Bar (Occupies center cleanly) -->
        <div class="flex-1 max-w-xs sm:max-w-sm bg-slate-200 h-3.5 sm:h-4 rounded-full overflow-hidden border border-slate-300 relative mx-2">
          <div id="hud-progress-fill" class="h-full bg-gradient-to-r from-amber-400 via-emerald-500 to-green-500 rounded-full transition-all duration-300 w-0"></div>
        </div>

        <!-- Sound & Music Action Buttons -->
        <div class="flex items-center gap-1.5">
          <!-- Background Music Toggle Button -->
          <button id="music-btn" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-100 hover:bg-slate-200 active:scale-90 text-slate-700 flex items-center justify-center text-sm sm:text-base border-2 border-slate-300 shadow-xs transition-all" aria-label="Toggle Music" title="Background Music">
            🎵
          </button>

          <!-- SFX Sound Toggle Button -->
          <button id="sound-btn" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-100 hover:bg-slate-200 active:scale-90 text-slate-700 flex items-center justify-center text-sm sm:text-base border-2 border-slate-300 shadow-xs transition-all" aria-label="Toggle Sound" title="Toggle Sound Effects">
            🔊
          </button>
        </div>
      </div>

      <!-- Question Prompt Area -->
      <div id="question-container" class="w-full my-auto flex flex-col items-center justify-center">
        <div id="prompt-left-col" class="w-full flex flex-col items-center">
          <h2 id="prompt-label" class="text-base sm:text-lg md:text-xl font-extrabold text-slate-600 mb-2">
            <!-- Dynamic prompt text -->
          </h2>

          <div id="prompt-content" class="w-full flex items-center justify-center mb-2 min-h-[90px] sm:min-h-[120px]">
            <!-- Flag SVG or Country Name badge -->
          </div>
        </div>

        <!-- 3 Interactive Big Option Buttons -->
        <div id="options-container" class="w-full flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-3 mt-1">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Dynamic Feedback Bar -->
      <div id="feedback-bar" class="w-full h-8 sm:h-9 mt-1 flex items-center justify-center font-black text-sm sm:text-base md:text-lg text-emerald-600 transition-opacity duration-200 opacity-0">
        <!-- "VROOOOM! +4 SPOTS!" or "SKID! -1 Spot!" -->
      </div>
    </div>
  </div>


  <!-- ==========================================================================
       5. VICTORY GRAND PRIX MODAL
       ========================================================================== -->
  <div id="win-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-amber-400 text-center flex flex-col items-center">
      
      <!-- Checkered Racing Header -->
      <div class="flex items-center justify-center gap-2 text-3xl sm:text-4xl mb-2">
        <span>🏁</span>
        <span class="font-black text-slate-800 tracking-tight">WINNER!</span>
        <span>🏁</span>
      </div>

      <p class="text-slate-600 font-bold text-base sm:text-lg mb-4">
        You crossed the finish line in 1st Place!
      </p>

      <!-- Giant Golden Trophy with Toddler Bounce -->
      <div class="w-32 h-32 sm:w-40 sm:h-40 my-2 flex items-center justify-center trophy-anim">
        <svg viewBox="0 0 160 160" class="w-full h-full drop-shadow-xl">
          <!-- Golden Cup Base & Pedestal -->
          <rect x="52" y="132" width="56" height="14" rx="4" fill="#78350f" />
          <rect x="62" y="122" width="36" height="10" rx="3" fill="#b45309" />
          <polygon points="70,122 90,122 84,95 76,95" fill="#f59e0b" />
          <!-- Handles -->
          <path d="M 46 44 C 18 44 18 84 48 84" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
          <path d="M 114 44 C 142 44 142 84 112 84" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
          <path d="M 46 44 C 22 44 22 84 48 84" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" />
          <path d="M 114 44 C 138 44 138 84 112 84" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" />
          <!-- Cup Chalice -->
          <path d="M 44 32 L 116 32 L 106 88 Q 80 102 54 88 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3" />
          <!-- Star on cup -->
          <polygon points="80,48 83,57 92,57 85,63 88,72 80,66 72,72 75,63 68,57 77,57" fill="#ffffff" />
          <!-- Sparkles -->
          <circle cx="120" cy="24" r="4" fill="#fef08a" />
          <circle cx="36" cy="30" r="3" fill="#fef08a" />
        </svg>
      </div>

      <!-- Play Again Button -->
      <button id="play-again-btn" class="w-full py-4 mt-4 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 active:scale-95 text-white font-black text-xl sm:text-2xl rounded-2xl shadow-lg shadow-emerald-500/30 transition-all flex items-center justify-center gap-3 border-2 border-emerald-400">
        <span>Race Again!</span>
        <span>🏎️💨</span>
      </button>
    </div>
  </div>

  <!-- ==========================================================================
       5. JAVASCRIPT: LOGIC, TRACK GEOMETRY, SOUND & ANIMATIONS
       ========================================================================== -->
  <script>
    /* ==========================================================================
       A. COMPLETE 26-FLAG VECTOR DATABASE
       Includes all 18 from Flag Match + Australia, Germany, Greece, Ecuador,
       Ireland, Uruguay, Ghana, Croatia. Crisp offline SVGs!

    const COUNTRIES = [
      {

      },
      {
        id: 'france',
        name: 'France',
        svg: `<svg viewBox="0 0 300 200"><rect width="100" height="200" fill="#002654"/><rect x="100" width="100" height="200" fill="#FFFFFF"/><rect x="200" width="100" height="200" fill="#CE1126"/></svg>`
      },
      {

        svg: `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#FFFFFF"/><rect x="150" width="150" height="100" fill="#D21034"/><rect y="100" width="150" height="100" fill="#005293"/><g transform="translate(75, 50)"><polygon points="0,-22 6,-6 22,-6 9,4 14,20 0,9 -14,20 -9,4 -22,-6 -6,-6" fill="#005293"/></g><g transform="translate(225, 150)"><polygon points="0,-22 6,-6 22,-6 9,4 14,20 0,9 -14,20 -9,4 -22,-6 -6,-6" fill="#D21034"/></g></svg>`
      }
    ];

    /* ==========================================================================
       B. AUDIO SYSTEM: ENGINE VROOMS, MUSIC, CRASH & VICTORY CHEER
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = localStorage.getItem('flag_racer_sfx_enabled') !== 'false';
    let musicEnabled = localStorage.getItem('flag_racer_music_enabled') !== 'false';

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) {
          audioCtx = new AudioClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Rotating Forward Audio Effects: forward1.mp3 through forward5.mp3 (< 4s each)
    const forwardAudios = [1, 2, 3, 4, 5].map(i => new Audio(`./forward${i}.mp3`));
    forwardAudios.forEach(a => { a.preload = 'auto'; });
    let fwdAudioIdx = 0;

    // Rotating Backward / Crash Audio Effects: backward1.mp3 through backward5.mp3 (< 4s each)
    const backwardAudios = [1, 2, 3, 4, 5].map(i => new Audio(`./backward${i}.mp3`));
    backwardAudios.forEach(a => { a.preload = 'auto'; });
    let bwdAudioIdx = 0;

    // Cheering Kids Audio for Victory
    const cheerAudio = new Audio('./cheer.mp3');
    cheerAudio.preload = 'auto';

    // Background Music (Upbeat & Cheerful, Played at Lower Volume)
    const bgmAudio = new Audio('./happy.mp3');
    bgmAudio.preload = 'auto';
    bgmAudio.loop = true;
    bgmAudio.volume = 0.20; // Lower volume than SFX (0.20 vs 0.90)

    function startBgmIfNeeded() {
      if (musicEnabled && soundEnabled && bgmAudio.paused) {
        bgmAudio.play().catch(() => {});
      }
    }

    // Racing Engine Rev: Rotating between 5 forward sounds (+4 spots forward)
    function playEngineRev() {
      if (!soundEnabled) return;
      try {
        // Pause any currently playing backward audio
        backwardAudios.forEach(a => { a.pause(); a.currentTime = 0; });

        const audioToPlay = forwardAudios[fwdAudioIdx];
        fwdAudioIdx = (fwdAudioIdx + 1) % forwardAudios.length;

        audioToPlay.currentTime = 0;
        audioToPlay.volume = 0.92;
        const p = audioToPlay.play();
        if (p && p.catch) {
          p.catch(() => playEngineSynthFallback());
        }
      } catch (e) {
        playEngineSynthFallback();
      }
    }

    function playEngineSynthFallback() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      osc1.type = 'sawtooth';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(120, now);
      osc1.frequency.exponentialRampToValueAtTime(360, now + 0.3);
      osc1.frequency.exponentialRampToValueAtTime(170, now + 0.65);
      osc2.frequency.setValueAtTime(60, now);
      osc2.frequency.exponentialRampToValueAtTime(180, now + 0.3);
      osc2.frequency.exponentialRampToValueAtTime(85, now + 0.65);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(500, now);
      filter.frequency.linearRampToValueAtTime(3200, now + 0.28);
      filter.frequency.exponentialRampToValueAtTime(400, now + 0.65);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.25, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.72);
      osc2.stop(now + 0.72);
    }

    // Realistic Crash / Skid: Rotating between 5 backward sounds (-1 spot backward)
    function playCrashSound() {
      if (!soundEnabled) return;
      try {
        // Pause any currently playing forward audio
        forwardAudios.forEach(a => { a.pause(); a.currentTime = 0; });

        const audioToPlay = backwardAudios[bwdAudioIdx];
        bwdAudioIdx = (bwdAudioIdx + 1) % backwardAudios.length;

        audioToPlay.currentTime = 0;
        audioToPlay.volume = 0.9;
        const p = audioToPlay.play();
        if (p && p.catch) {
          p.catch(() => playCrashSynthFallback());
        }
      } catch (e) {
        playCrashSynthFallback();
      }
    }

    function playCrashSynthFallback() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(75, now + 0.22);

      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.24);
    }

    // Grand Prix Victory Fanfare
    function playWinFanfare() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const notes = [
        { f: 523.25, d: 0.15, t: 0 },      // C5
        { f: 659.25, d: 0.15, t: 0.15 },   // E5
        { f: 783.99, d: 0.15, t: 0.30 },   // G5
        { f: 1046.50, d: 0.45, t: 0.45 },  // C6
        { f: 880.00, d: 0.15, t: 0.95 },   // A5
        { f: 1046.50, d: 0.70, t: 1.10 }   // C6 long
      ];

      const now = ctx.currentTime;
      notes.forEach((n) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now + n.t);

        gain.gain.setValueAtTime(0.001, now + n.t);
        gain.gain.linearRampToValueAtTime(0.24, now + n.t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.05);
      });
    }

    // Pronounce country name using Web Speech API
    function speakCountryName(text) {
      if ('speechSynthesis' in window && soundEnabled) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.88;
          utterance.pitch = 1.15;
          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      }
    }

    /* ==========================================================================
       C. RACETRACK PERIMETER GEOMETRY & PIXEL-PERFECT CAR CENTERING
       Surrounds the game:
       Starts on lower-left corner -> moves RIGHT -> UP -> LEFT -> DOWN to finish
       ========================================================================== */
    const TOTAL_SPOTS = 40;
    let currentSpot = 0;
    let animFrameId = null;

    const trackPath = document.getElementById('track-path');
    const raceCarGroup = document.getElementById('race-car-group');
    const carVisuals = document.getElementById('car-visuals');
    const carFlames = document.getElementById('car-flames');
    const carSpeedStreak = document.getElementById('car-speed-streak');
    const carSkidSmoke = document.getElementById('car-skid-smoke');
    const hudProgressFill = document.getElementById('hud-progress-fill');

    function updateTrackGeometry() {
      const svg = document.getElementById('circuit-svg');
      const w = window.innerWidth;
      const h = window.innerHeight;
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

      // Responsive track scale
      const isCompact = Math.min(w, h) < 600;
      const inset = isCompact ? 36 : 48;
      const roadWidth = isCompact ? 48 : 58;
      const radius = isCompact ? 50 : 66;

      const xLeft = inset;
      const xRight = w - inset;
      const yTop = inset;
      const yBottom = h - inset;

      // Circle arc bezier constant: k = 4 * (sqrt(2) - 1) / 3
      const k = 0.5522847498;

      // Surrounds screen starting at lower-left, going RIGHT -> UP -> LEFT -> DOWN
      const d = [
        `M ${xLeft + radius} ${yBottom}`,
        // 1. Bottom straight: Moving RIGHT
        `L ${xRight - radius} ${yBottom}`,
        // Corner 1: Bottom-Right curving UP
        `C ${xRight - radius * (1 - k)} ${yBottom}, ${xRight} ${yBottom - radius * (1 - k)}, ${xRight} ${yBottom - radius}`,
        // 2. Right straight: Moving UP
        `L ${xRight} ${yTop + radius}`,
        // Corner 2: Top-Right curving LEFT
        `C ${xRight} ${yTop + radius * (1 - k)}, ${xRight - radius * (1 - k)} ${yTop}, ${xRight - radius} ${yTop}`,
        // 3. Top straight: Moving LEFT
        `L ${xLeft + radius} ${yTop}`,
        // Corner 3: Top-Left curving DOWN
        `C ${xLeft + radius * (1 - k)} ${yTop}, ${xLeft} ${yTop + radius * (1 - k)}, ${xLeft} ${yTop + radius}`,
        // 4. Left straight: Moving DOWN to Finish line
        `L ${xLeft} ${yBottom - radius}`,
        // Corner 4: Lower-Left curving into start/finish line
        `C ${xLeft} ${yBottom - radius * (1 - k)}, ${xLeft + radius * (1 - k)} ${yBottom}, ${xLeft + radius} ${yBottom}`,
        `Z`
      ].join(' ');

      // Update all SVG track layers
      document.getElementById('track-border-outer').setAttribute('d', d);
      document.getElementById('track-border-outer').setAttribute('stroke-width', roadWidth + 14);

      document.getElementById('track-kerb-red').setAttribute('d', d);
      document.getElementById('track-kerb-red').setAttribute('stroke-width', roadWidth + 14);

      document.getElementById('track-asphalt').setAttribute('d', d);
      document.getElementById('track-asphalt').setAttribute('stroke-width', roadWidth);

      document.getElementById('track-centerline').setAttribute('d', d);
      trackPath.setAttribute('d', d);

      // Dynamic arena padding ensures the center card never overlaps the track
      const arenaPad = Math.round(inset + roadWidth / 2 + 10);
      const centerArena = document.getElementById('center-arena');
      if (centerArena) {
        centerArena.style.padding = `${arenaPad}px`;
      }

      // Render Checkered Start/Finish Grid at (xLeft + radius, yBottom)
      renderStartFinishLine(xLeft + radius, yBottom, roadWidth);

      // Position car immediately at currentSpot
      placeCarAtSpot(currentSpot);
    }

    function renderStartFinishLine(startX, startY, roadWidth) {
      const g = document.getElementById('start-finish-group');
      g.innerHTML = `
        <!-- Checkered Starting Line Strip across road -->
        <rect x="${startX - 12}" y="${startY - roadWidth / 2}" width="24" height="${roadWidth}" fill="url(#checkered-pattern)" rx="2" stroke="#0f172a" stroke-width="1.5" />
        
        <!-- White Starting Line Marker Box -->
        <line x1="${startX + 12}" y1="${startY - roadWidth / 2}" x2="${startX + 12}" y2="${startY + roadWidth / 2}" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        
        <!-- START / FINISH Gantry / Road Text -->
        <g id="gantry-sign" transform="translate(${startX + 18}, ${startY - roadWidth / 2 - 16})">
          <rect x="-6" y="-12" width="122" height="22" rx="7" fill="#0f172a" stroke="#facc15" stroke-width="2.5" />
          <text x="55" y="3" fill="#ffffff" font-size="11" font-weight="900" font-family="'Nunito', sans-serif" text-anchor="middle" letter-spacing="0.5">🏁 START / FINISH</text>
        </g>
      `;
    }

    // Given spot (0..40+), smoothly calculate (x, y, angle) and transform raceCarGroup
    function placeCarAtSpot(spotValue) {
      if (!trackPath || !trackPath.getTotalLength) return;
      const totalLen = trackPath.getTotalLength();
      if (totalLen <= 0) return;

      // Wrapping using modulo allows smooth celebration sprints past the finish line!
      const progress = (spotValue % TOTAL_SPOTS) / TOTAL_SPOTS;
      const dist = progress * (totalLen - 2);

      // Compute tangent points directly along the SVG path
      const p1 = trackPath.getPointAtLength(Math.max(0, dist - 3));
      const p2 = trackPath.getPointAtLength(Math.min(totalLen, dist + 3));

      const pCenter = trackPath.getPointAtLength(dist);
      const angleDeg = Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);

      // Shared SVG coordinate space guarantees 100% pixel-perfect centering on centerline
      raceCarGroup.setAttribute('transform', `translate(${pCenter.x}, ${pCenter.y}) rotate(${angleDeg})`);
      
      // Update HUD bar
      const percent = Math.min(100, Math.round((spotValue / TOTAL_SPOTS) * 100));
      hudProgressFill.style.width = `${percent}%`;
    }

    // Animate car from currentSpot to targetSpot with easing
    function animateCarTo(targetSpot, durationMs = 650, isForward = true, onComplete) {
      if (animFrameId) cancelAnimationFrame(animFrameId);

      const startSpot = currentSpot;
      const startTime = performance.now();

      if (isForward) {
        carFlames.classList.remove('hidden');
        carSpeedStreak.classList.remove('hidden');
        carSkidSmoke.classList.add('hidden');
      } else {
        carFlames.classList.add('hidden');
        carSpeedStreak.classList.add('hidden');
        carSkidSmoke.classList.remove('hidden');
        carVisuals.classList.add('car-skid-anim');
        setTimeout(() => {
          carVisuals.classList.remove('car-skid-anim');
          carSkidSmoke.classList.add('hidden');
        }, 500);
      }

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / durationMs);

        // Ease Out Cubic
        const ease = 1 - Math.pow(1 - progress, 3);
        currentSpot = startSpot + (targetSpot - startSpot) * ease;
        placeCarAtSpot(currentSpot);

        if (progress < 1) {
          animFrameId = requestAnimationFrame(step);
        } else {
          currentSpot = targetSpot;
          placeCarAtSpot(currentSpot);
          carFlames.classList.add('hidden');
          carSpeedStreak.classList.add('hidden');
          if (onComplete) onComplete();
        }
      }

      animFrameId = requestAnimationFrame(step);
    }

    /* ==========================================================================
       D. QUESTION ENGINE & GAME STATE (Spaced Repetition)
       ========================================================================== */
    let countryQueue = [];
    let currentQuestion = null;
    let isFirstTryOnCurrent = true;
    let isAnswerLocked = false;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initGame() {
      currentSpot = 0;
      isAnswerLocked = false;
      countryQueue = shuffle(COUNTRIES);
      document.getElementById('win-modal').classList.add('hidden');
      
      const banner = document.getElementById('finish-banner');
      if (banner) {
        banner.classList.remove('scale-100');
        banner.classList.add('scale-0');
      }
      const gantry = document.getElementById('start-finish-group');
      if (gantry) gantry.classList.remove('gantry-celebrate');

      // Restore background music volume if active
      if (musicEnabled && soundEnabled && bgmAudio) {
        bgmAudio.volume = 0.20;
        if (bgmAudio.paused) bgmAudio.play().catch(() => {});
      }

      updateTrackGeometry();
      loadNextQuestion();
    }

    function loadNextQuestion() {
      if (currentSpot >= TOTAL_SPOTS) {
        runFinishLineCelebration();
        return;
      }

      if (countryQueue.length === 0) {
        countryQueue = shuffle(COUNTRIES);
      }

      const targetCountry = countryQueue.shift();
      isFirstTryOnCurrent = true;
      isAnswerLocked = false;

      // Pick 2 random distractor countries
      const others = COUNTRIES.filter(c => c.id !== targetCountry.id);
      const shuffledOthers = shuffle(others);
      const distractors = [shuffledOthers[0], shuffledOthers[1]];

      // 50/50 Question Type:
      // Type A: 1 Flag prompt, 3 Name options
      // Type B: 1 Name prompt, 3 Flag options
      const questionType = Math.random() < 0.5 ? 'typeA' : 'typeB';
      const options = shuffle([targetCountry, ...distractors]);

      currentQuestion = {
        type: questionType,
        target: targetCountry,
        options: options
      };

      renderQuestion(currentQuestion);
    }

    /* ==========================================================================
       E. UI RENDERING (Guaranteed Screen Fit)
       ========================================================================== */
    const promptLabel = document.getElementById('prompt-label');
    const promptContent = document.getElementById('prompt-content');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBar = document.getElementById('feedback-bar');

    function renderQuestion(q) {
      feedbackBar.style.opacity = '0';
      feedbackBar.textContent = '';
      optionsContainer.innerHTML = '';

      if (q.type === 'typeA') {
        // TYPE A: Flag prompt -> 3 Name Buttons
        promptLabel.textContent = '';
        promptContent.innerHTML = `
          <div class="w-40 h-24 sm:w-52 sm:h-32 bg-white rounded-2xl p-1.5 flag-card-shadow border-2 border-slate-300 transform hover:scale-105 transition-transform duration-200">
            <div class="flag-svg-container">
              ${q.target.svg}
            </div>
          </div>
        `;

        q.options.forEach((country) => {
          const btn = document.createElement('button');
          btn.className = `btn-option w-full sm:flex-1 py-3 px-2 bg-slate-100 hover:bg-slate-50 text-slate-800 font-extrabold text-lg sm:text-xl rounded-2xl border-4 border-slate-300 shadow-md flex items-center justify-center min-h-[58px] sm:min-h-[68px]`;
          btn.innerHTML = `<span>${country.name}</span>`;
          btn.onclick = () => handleChoice(country, btn);
          optionsContainer.appendChild(btn);
        });

      } else {
        // TYPE B: Name prompt -> 3 Flag Buttons
        promptLabel.textContent = '';
        promptContent.innerHTML = `
          <div class="inline-flex items-center gap-2 bg-emerald-100 border-2 border-emerald-400 text-emerald-950 px-4 py-1.5 rounded-2xl shadow-sm">
            <span class="text-xl sm:text-2xl font-black tracking-wide">${q.target.name}</span>
            <button id="tts-btn" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white text-emerald-800 flex items-center justify-center text-sm shadow hover:bg-emerald-50 active:scale-90" title="Sound out name">
              🗣️
            </button>
          </div>
        `;

        document.getElementById('tts-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          speakCountryName(q.target.name);
        });

        q.options.forEach((country) => {
          const btn = document.createElement('button');
          btn.className = `btn-option w-full sm:flex-1 p-1 bg-slate-100 hover:bg-slate-50 rounded-2xl border-4 border-slate-300 shadow-md flex items-center justify-center min-h-[76px] sm:min-h-[92px]`;
          btn.innerHTML = `
            <div class="w-full h-16 sm:h-20 flag-svg-container pointer-events-none">
              ${country.svg}
            </div>
          `;
          btn.onclick = () => handleChoice(country, btn);
          optionsContainer.appendChild(btn);
        });
      }
    }

    /* ==========================================================================
       F. USER INTERACTION & SCORING (+4 spots on correct, -1 on wrong)
       ========================================================================== */
    function handleChoice(selectedCountry, btnElement) {
      if (isAnswerLocked) return;
      startBgmIfNeeded();
      getAudioCtx();

      const isCorrect = selectedCountry.id === currentQuestion.target.id;

      if (isCorrect) {
        // --- CORRECT ANSWER ---
        isAnswerLocked = true;
        playEngineRev();

        btnElement.classList.remove('bg-slate-100', 'border-slate-300', 'hover:bg-slate-50');
        btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-950', 'ring-4', 'ring-emerald-300');

        const targetSpot = currentSpot + 4;

        if (targetSpot >= TOTAL_SPOTS) {
          // Reaching the finish line!
          feedbackBar.textContent = '🏁 SPRINT TO THE FINISH LINE!';
          feedbackBar.className = 'w-full h-8 sm:h-9 mt-1 flex items-center justify-center font-black text-base sm:text-xl text-amber-500 transition-opacity duration-200 opacity-100';

          // Animate straight to the checkered line first
          animateCarTo(TOTAL_SPOTS, 750, true, () => {
            runFinishLineCelebration();
          });
        } else {
          feedbackBar.textContent = '🏎️💨 VROOOOM! +4 Spots!';
          feedbackBar.className = 'w-full h-8 sm:h-9 mt-1 flex items-center justify-center font-black text-base sm:text-xl text-emerald-600 transition-opacity duration-200 opacity-100';

          // Animate racecar forward 4 spots
          animateCarTo(targetSpot, 750, true, () => {
            setTimeout(() => {
              loadNextQuestion();
            }, 800);
          });
        }

      } else {
        // --- INCORRECT ANSWER ---
        playCrashSound();

        btnElement.classList.remove('bg-slate-100', 'border-slate-300');
        btnElement.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900', 'shake-anim');
        btnElement.disabled = true;

        setTimeout(() => {
          btnElement.classList.remove('shake-anim');
        }, 450);

        feedbackBar.textContent = '💥 SKID! -1 Spot! Keep trying!';
        feedbackBar.className = 'w-full h-8 sm:h-9 mt-1 flex items-center justify-center font-black text-sm sm:text-base text-rose-500 transition-opacity duration-200 opacity-100';

        // Animate racecar backward 1 spot
        const targetSpot = Math.max(0, currentSpot - 1);
        animateCarTo(targetSpot, 380, false);

        // Spaced repetition: re-insert target country 2 steps back
        if (isFirstTryOnCurrent) {
          isFirstTryOnCurrent = false;
          const reinsertIdx = Math.min(2, countryQueue.length);
          countryQueue.splice(reinsertIdx, 0, currentQuestion.target);
        }
      }
    }

    /* ==========================================================================
       G. CELEBRATORY FINISH LINE CROSSING & FIREWORKS SEQUENCE
       ========================================================================== */
    function runFinishLineCelebration() {
      // 1. Lower BGM so victory cheer & fanfare take center stage
      if (bgmAudio && !bgmAudio.paused) {
        bgmAudio.volume = 0.05;
      }

      // 2. Play Kids Cheer & Grand Prix Trumpet Fanfare
      if (soundEnabled) {
        try {
          cheerAudio.currentTime = 0;
          cheerAudio.volume = 0.95;
          cheerAudio.play().catch(() => {});
        } catch (e) {}
        playWinFanfare();
      }

      // 3. Highlight Start/Finish Gantry with flashing celebration glow
      const gantry = document.getElementById('start-finish-group');
      if (gantry) gantry.classList.add('gantry-celebrate');

      // 4. Pop up celebratory Finish Banner
      const finishBanner = document.getElementById('finish-banner');
      if (finishBanner) {
        finishBanner.classList.remove('scale-0');
        finishBanner.classList.add('scale-100');
      }

      // 5. Sequence of colorful fireworks around the circuit
      const w = window.innerWidth;
      const h = window.innerHeight;
      createFireworkBurst(w * 0.16, h * 0.82); // near finish line
      setTimeout(() => createFireworkBurst(w * 0.35, h * 0.22), 500);
      setTimeout(() => createFireworkBurst(w * 0.82, h * 0.28), 1000);
      setTimeout(() => createFireworkBurst(w * 0.80, h * 0.72), 1500);
      setTimeout(() => createFireworkBurst(w * 0.50, h * 0.40), 2000);

      // 6. Victory Lap Sprint: Car blasts across checkered finish line and past start (doubled duration)
      animateCarTo(46, 2700, true, () => {
        setTimeout(() => {
          if (finishBanner) {
            finishBanner.classList.remove('scale-100');
            finishBanner.classList.add('scale-0');
          }
          if (gantry) gantry.classList.remove('gantry-celebrate');
          
          triggerWinModal();
        }, 400);
      });
    }

    // Spawn expanding particle fireworks
    function createFireworkBurst(x, y) {
      const container = document.getElementById('fireworks-container');
      if (!container) return;

      const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#ffffff', '#a855f7'];
      const burstColor = colors[Math.floor(Math.random() * colors.length)];
      const sparkCount = 18;

      for (let i = 0; i < sparkCount; i++) {
        const spark = document.createElement('div');
        spark.className = 'firework-spark';
        const angle = (i / sparkCount) * 2 * Math.PI;
        const dist = 35 + Math.random() * 55;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        spark.style.left = `${x}px`;
        spark.style.top = `${y}px`;
        spark.style.backgroundColor = Math.random() > 0.4 ? burstColor : '#ffffff';
        spark.style.setProperty('--tx', `${tx}px`);
        spark.style.setProperty('--ty', `${ty}px`);

        container.appendChild(spark);
        setTimeout(() => spark.remove(), 920);
      }
    }

    function triggerWinModal() {
      document.getElementById('win-modal').classList.remove('hidden');
      launchConfetti();
    }

    function launchConfetti() {
      const colors = ['#ef4444', '#facc15', '#10b981', '#3b82f6', '#ec4899', '#ffffff'];
      for (let i = 0; i < 75; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = `${Math.random() * 1.5}s`;
        piece.style.animationDuration = `${2.2 + Math.random() * 2}s`;
        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 4500);
      }
    }

    /* ==========================================================================
       H. RESIZE OBSERVER & AUDIO CONTROLS
       ========================================================================== */
    const soundBtn = document.getElementById('sound-btn');
    const musicBtn = document.getElementById('music-btn');

    function updateSoundUi() {
      if (soundBtn) {
        soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
        soundBtn.title = soundEnabled ? 'Sound Effects: On' : 'Sound Effects: Muted';
      }
    }

    function updateMusicUi() {
      if (musicBtn) {
        musicBtn.textContent = musicEnabled ? '🎵' : '🔇';
        musicBtn.title = musicEnabled ? 'Background Music: On' : 'Background Music: Muted';
      }
    }

    soundBtn?.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('flag_racer_sfx_enabled', soundEnabled ? 'true' : 'false');
      updateSoundUi();
      if (!soundEnabled) {
        forwardAudios.forEach(a => a.pause());
        backwardAudios.forEach(a => a.pause());
        if (cheerAudio) cheerAudio.pause();
        bgmAudio.pause();
      } else {
        if (musicEnabled) bgmAudio.play().catch(() => {});
      }
    });

    musicBtn?.addEventListener('click', () => {
      musicEnabled = !musicEnabled;
      localStorage.setItem('flag_racer_music_enabled', musicEnabled ? 'true' : 'false');
      updateMusicUi();
      if (musicEnabled && soundEnabled) {
        bgmAudio.play().catch(() => {});
      } else {
        bgmAudio.pause();
      }
    });

    document.getElementById('play-again-btn').addEventListener('click', () => {
      initGame();
    });

    // Start BGM on first interaction
    document.addEventListener('pointerdown', () => {
      startBgmIfNeeded();
    }, { once: true });

    // Resize handling for responsive racetrack
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        updateTrackGeometry();
      }, 50);
    });

    window.addEventListener('orientationchange', () => {
      setTimeout(updateTrackGeometry, 100);
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateSoundUi();
      updateMusicUi();
      initGame();
    });
  </script>
</body>
</html>
