<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bloom Buddy 🐝</title>
  <meta name="description" content="Bilingual (English & Español) nature, seasons, and plant explorer game for preschoolers." />

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#fef9c3" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bloom Buddy" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Leaflet Maps (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header id="app-header"></header>
  <main id="app-main"></main>

  <!-- Hidden camera/photo file input for mobile camera capture -->
  <input
    type="file"
    id="camera-input"
    accept="image/*"
    capture="environment"
    hidden
  />

  <!-- Parent Settings Modal -->
  <dialog id="parent-dialog"></dialog>

  <!-- App Entry -->
  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
