<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flag Match - Momma Snake Game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>" />
  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-pastel: #F4F7F6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-pastel);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      overscroll-behavior: none;
      color: #2D3748;
    }

    /* Flag card frame */
    .flag-card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    .flag-svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 1rem;
    }

    .flag-svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 0.85rem;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
    }

    /* Massive Touch Buttons */
    .btn-option {
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .btn-option:active:not(:disabled) {
      transform: scale(0.96);
    }

    /* Gentle Shake on Incorrect */
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .shake-anim {
      animation: gentleShake 0.4s ease-in-out;
    }

    /* Snake Segment Pop-in */
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .segment-pop {
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Momma Snake Wiggle Animation */
    @keyframes wiggleWave {
      0% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(6deg); }
      75% { transform: translateY(12px) rotate(-6deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .wiggle-item {
      animation: wiggleWave 1.1s ease-in-out infinite alternate;
      animation-delay: calc(var(--seg-idx) * 0.08s);
    }

    /* Happy confetti float */
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      animation: confettiFall linear infinite;
      pointer-events: none;
    }
  </style>
</head>

        🔊

    </div>
  </header>

    <!-- Game Container Card -->
    <div class="w-full bg-white rounded-3xl p-5 sm:p-7 flag-card-shadow border border-slate-100 flex flex-col items-center">

      <div id="prompt-header" class="w-full text-center mb-4">
        <h2 id="prompt-label" class="text-lg sm:text-xl font-bold text-slate-500 mb-1">
          <!-- Dynamic text e.g. "Which country is this flag?" or "Find the flag for:" -->
        </h2>
        <div id="prompt-content" class="flex items-center justify-center gap-2 min-h-[50px]">
          <!-- Injected dynamically: either Big Name text or Big Flag SVG -->
        </div>
      </div>

      <!-- Options Container (3 Choices) -->
      <div id="options-container" class="w-full flex flex-col sm:flex-row gap-3.5 sm:gap-4 mt-2 justify-center">
        <!-- 3 Buttons injected dynamically -->
      </div>

      <!-- Encouraging Feedback Message -->
      <div id="feedback-bar" class="h-8 mt-4 flex items-center justify-center font-extrabold text-base sm:text-lg transition-opacity duration-200 opacity-0">
        <!-- Text like "Great Job! ⭐" -->
      </div>

    </div>

  </main>

  <!-- Snake Progress Dock (Bottom Edge) -->
  <footer class="w-full bg-emerald-50/90 backdrop-blur border-t-2 border-emerald-200/60 py-3 px-4">
    <div class="max-w-3xl mx-auto flex flex-col items-center gap-1.5">

          Length: 2

      </div>

      <!-- Snake Display Track -->
      <div class="w-full overflow-x-auto py-1 flex justify-center items-center">
        <div id="snake-track" class="flex items-center justify-center gap-1 sm:gap-1.5 min-h-[46px] px-2">
          <!-- Snake elements injected here -->
        </div>
      </div>
    </div>
  </footer>

  <!-- Win Celebration Overlay -->

    /* ==========================================================================
       2. GENTLE WEB AUDIO SYNTHESIS (Zero External Assets)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Soft, uplifting 3-note chime for correct answers
    function playSoftChime() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const freqs = [523.25, 659.25, 783.99]; // C5, E5, G5
      const now = ctx.currentTime;

      freqs.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);

        gain.gain.setValueAtTime(0, now + idx * 0.08);
        gain.gain.linearRampToValueAtTime(0.18, now + idx * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.55);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.6);
      });
    }

    // Ultra-soft, gentle low water/wood tap for wrong answers (No harsh buzzers!)
    function playGentleTap() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);

      gain.gain.setValueAtTime(0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.09);
    }

    // Joyful celebration fanfare when Momma Snake reaches 11 segments
    function playWinFanfare() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      const now = ctx.currentTime;

      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.11);

        gain.gain.setValueAtTime(0, now + idx * 0.11);
        gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.11 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 0.75);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + idx * 0.11);
        osc.stop(now + idx * 0.11 + 0.8);
      });
    }

    // Speech synthesis helper to sound out country name
    function speakCountryName(text) {
      if ('speechSynthesis' in window && soundEnabled) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.88; // Slightly slower, great for 4yo
          utterance.pitch = 1.1;
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          // Ignore if unsupported or blocked
        }
      }
    }

    /* ==========================================================================
       3. GAME STATE & SPACED REPETITION ENGINE
       ========================================================================== */
    const TARGET_WINS = 11;
    let score = 0;
    let countryQueue = [];
    let currentQuestion = null;
    let isFirstTryOnCurrent = true;
    let isAnswerLocked = false;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initGame() {
      score = 0;
      isAnswerLocked = false;
      countryQueue = shuffle(COUNTRIES);
      updateScoreUI();
      renderSnakeTrack();
      document.getElementById('win-modal').classList.add('hidden');
      document.getElementById('confetti-container').innerHTML = '';
      loadNextQuestion();
    }

    function updateScoreUI() {
      document.getElementById('score-text').textContent = `${score} / ${TARGET_WINS}`;
      // Total segments = 2 (head + tail) + score
      document.getElementById('snake-length-badge').textContent = `Length: ${2 + score}`;
    }

    function loadNextQuestion() {
      if (score >= TARGET_WINS) {
        showWinScreen();
        return;
      }

      // If queue is running low, replenish with more shuffled countries
      if (countryQueue.length === 0) {
        countryQueue = shuffle(COUNTRIES);
      }

      const targetCountry = countryQueue.shift();
      isFirstTryOnCurrent = true;
      isAnswerLocked = false;

      // Pick 2 random distractor countries
      const otherCountries = COUNTRIES.filter(c => c.id !== targetCountry.id);
      const shuffledOthers = shuffle(otherCountries);
      const distractors = [shuffledOthers[0], shuffledOthers[1]];

      // 50/50 Question Type:
      // Type A: 1 Flag prompt, 3 Name options
      // Type B: 1 Name prompt, 3 Flag options
      const questionType = Math.random() < 0.5 ? 'typeA' : 'typeB';

      const options = shuffle([targetCountry, ...distractors]);

      currentQuestion = {
        type: questionType,
        target: targetCountry,
        options: options
      };

      renderQuestion(currentQuestion);
    }

    /* ==========================================================================
       4. UI RENDERING
       ========================================================================== */
    const promptHeader = document.getElementById('prompt-header');
    const promptLabel = document.getElementById('prompt-label');
    const promptContent = document.getElementById('prompt-content');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBar = document.getElementById('feedback-bar');

    function renderQuestion(q) {
      feedbackBar.style.opacity = '0';
      feedbackBar.textContent = '';
      optionsContainer.innerHTML = '';

      if (q.type === 'typeA') {
        // TYPE A: 1 Flag Prompt -> 3 Name Options
        promptLabel.textContent = 'Which country is this flag?';
        promptContent.innerHTML = `
          <div class="w-48 h-32 sm:w-60 sm:h-40 bg-white rounded-2xl p-1.5 flag-card-shadow border-2 border-slate-200/80 transform hover:scale-105 transition-transform duration-200">
            <div class="flag-svg-container">
              ${q.target.svg}
            </div>
          </div>
        `;

        // 3 Name buttons
        q.options.forEach((country) => {
          const btn = document.createElement('button');
          btn.className = `btn-option w-full sm:flex-1 py-4 px-4 bg-slate-50 hover:bg-white text-slate-800 font-extrabold text-xl sm:text-2xl rounded-2xl border-4 border-slate-200 shadow-sm flex items-center justify-center gap-2 min-h-[76px]`;
          btn.innerHTML = `
            <span>${country.name}</span>
          `;
          btn.onclick = () => handleChoice(country, btn);
          optionsContainer.appendChild(btn);
        });

      } else {
        // TYPE B: 1 Name Prompt -> 3 Flag Options
        promptLabel.textContent = 'Find the flag for:';
        promptContent.innerHTML = `
          <div class="inline-flex items-center gap-2.5 bg-emerald-100/80 border-2 border-emerald-300 text-emerald-900 px-6 py-2.5 rounded-2xl shadow-sm">
            <span class="text-2xl sm:text-3xl font-black tracking-wide">${q.target.name}</span>
            <button id="tts-btn" class="w-8 h-8 rounded-full bg-white text-emerald-800 flex items-center justify-center text-sm shadow hover:bg-emerald-50 active:scale-90" title="Sound out name">
              🗣️
            </button>
          </div>
        `;

        document.getElementById('tts-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          speakCountryName(q.target.name);
        });

        // 3 Flag buttons
        q.options.forEach((country) => {
          const btn = document.createElement('button');
          btn.className = `btn-option w-full sm:flex-1 p-2 bg-slate-50 hover:bg-white rounded-2xl border-4 border-slate-200 shadow-sm flex items-center justify-center min-h-[96px] sm:min-h-[120px]`;
          btn.innerHTML = `
            <div class="w-full h-24 sm:h-28 flag-svg-container pointer-events-none">
              ${country.svg}
            </div>
          `;
          btn.onclick = () => handleChoice(country, btn);
          optionsContainer.appendChild(btn);
        });
      }
    }

    /* ==========================================================================
       5. INTERACTION & SPACED REPETITION LOGIC
       ========================================================================== */
    function handleChoice(selectedCountry, btnElement) {
      if (isAnswerLocked) return;

      // Resume audio context on user interaction
      getAudioCtx();

      const isCorrect = selectedCountry.id === currentQuestion.target.id;

      if (isCorrect) {
        // --- CORRECT ANSWER ---
        isAnswerLocked = true;
        playSoftChime();

        // Highlight correct button
        btnElement.classList.remove('bg-slate-50', 'border-slate-200', 'hover:bg-white');
        btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'ring-4', 'ring-emerald-300/60');
        
        // Positive feedback message
        feedbackBar.textContent = '🌟 Yes! Awesome job!';
        feedbackBar.className = 'h-8 mt-4 flex items-center justify-center font-black text-xl text-emerald-600 transition-opacity duration-200 opacity-100';

        // Increment score & Momma snake length
        score++;
        updateScoreUI();
        addSnakeSegment();

        // Delay 1.5s before next question
        setTimeout(() => {
          loadNextQuestion();
        }, 1500);

      } else {
        // --- INCORRECT ANSWER ---
        playGentleTap();

        // Gentle soft red highlight + gentle CSS shake
        btnElement.classList.remove('bg-slate-50', 'border-slate-200');
        btnElement.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-800', 'shake-anim');
        btnElement.disabled = true;

        // Remove shake class after animation completes so it can shake again if retriggered
        setTimeout(() => {
          btnElement.classList.remove('shake-anim');
        }, 450);

        // Feedback prompt
        feedbackBar.textContent = 'Almost! Try another one! 🌱';
        feedbackBar.className = 'h-8 mt-4 flex items-center justify-center font-bold text-base text-rose-500 transition-opacity duration-200 opacity-100';

        // Spaced Repetition Rule:
        // "If incorrect on first try, re-insert country 2 steps back in queue."
        if (isFirstTryOnCurrent) {
          isFirstTryOnCurrent = false;
          const reinsertIndex = Math.min(2, countryQueue.length);
          countryQueue.splice(reinsertIndex, 0, currentQuestion.target);
        }
      }
    }

    /* ==========================================================================
       6. MOMMA SNAKE RENDERING & ANIMATIONS
       ========================================================================== */
    const snakeTrack = document.getElementById('snake-track');

    function createSnakeHead(isWinState = false) {
      const head = document.createElement('div');
      head.className = `relative w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-emerald-500 border-2 border-emerald-600 shadow-sm flex items-center justify-center shrink-0 z-10 ${isWinState ? 'wiggle-item' : ''}`;
      if (isWinState) {
        head.style.setProperty('--seg-idx', '0');
      }
      head.innerHTML = `
        <!-- Cute Eyes -->
        <div class="absolute top-2 left-2 w-2.5 h-2.5 bg-white rounded-full flex items-center justify-center">
          <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
        </div>
        <div class="absolute top-2 right-2 w-2.5 h-2.5 bg-white rounded-full flex items-center justify-center">
          <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
        </div>
        <!-- Blush cheeks -->
        <div class="absolute top-4 left-1 w-2 h-1 bg-rose-300 rounded-full"></div>
        <div class="absolute top-4 right-1 w-2 h-1 bg-rose-300 rounded-full"></div>
        <!-- Smile & Cute Tongue -->
        <div class="absolute bottom-1.5 flex flex-col items-center">
          <div class="w-3 h-1.5 border-b-2 border-emerald-800 rounded-full"></div>
          <div class="w-1.5 h-2 bg-pink-400 rounded-b-full"></div>
        </div>
      `;
      return head;
    }

    function createSnakeTail(idx, isWinState = false) {
      const tail = document.createElement('div');
      tail.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-emerald-600 border-2 border-emerald-700 shadow-xs shrink-0 flex items-center justify-center ${isWinState ? 'wiggle-item' : ''}`;
      if (isWinState) {
        tail.style.setProperty('--seg-idx', idx.toString());
      }
      tail.innerHTML = `<div class="w-2 h-2 rounded-full bg-emerald-400"></div>`;
      return tail;
    }

    function createBodySegment(idx, isNew = false, isWinState = false) {
      const seg = document.createElement('div');
      const popClass = isNew ? 'segment-pop' : '';
      const wiggleClass = isWinState ? 'wiggle-item' : '';
      seg.className = `w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-tr from-emerald-500 to-green-400 border-2 border-emerald-600 shadow-xs shrink-0 flex items-center justify-center ${popClass} ${wiggleClass}`;
      if (isWinState) {
        seg.style.setProperty('--seg-idx', idx.toString());
      }
      seg.innerHTML = `<div class="w-2 h-2 rounded-full bg-yellow-200/90 shadow-xs"></div>`;
      return seg;
    }

    function renderSnakeTrack() {
      snakeTrack.innerHTML = '';

      // 1. Head
      snakeTrack.appendChild(createSnakeHead(false));

      // 2. Middle Body segments (score count)
      for (let i = 1; i <= score; i++) {
        snakeTrack.appendChild(createBodySegment(i, false, false));
      }

      // 3. Tail
      snakeTrack.appendChild(createSnakeTail(score + 1, false));
    }

    function addSnakeSegment() {
      // Re-render snake with a pop animation on the newly added segment
      snakeTrack.innerHTML = '';
      snakeTrack.appendChild(createSnakeHead(false));

      for (let i = 1; i <= score; i++) {
        const isNew = i === score;
        snakeTrack.appendChild(createBodySegment(i, isNew, false));
      }

      snakeTrack.appendChild(createSnakeTail(score + 1, false));
    }

    /* ==========================================================================
       7. WIN SCREEN & CELEBRATION
       ========================================================================== */
    function showWinScreen() {
      playWinFanfare();

      const winModal = document.getElementById('win-modal');
      const winSnakeTrack = document.getElementById('win-snake-track');
      winModal.classList.remove('hidden');

      // Build the 13-segment Momma Snake on win stage (Head + 11 Body segments + Tail)
      winSnakeTrack.innerHTML = '';
      winSnakeTrack.appendChild(createSnakeHead(true));

      for (let i = 1; i <= TARGET_WINS; i++) {
        winSnakeTrack.appendChild(createBodySegment(i, false, true));
      }

      winSnakeTrack.appendChild(createSnakeTail(TARGET_WINS + 1, true));

      // Generate colorful confetti
      spawnConfetti();
    }

    function spawnConfetti() {
      const container = document.getElementById('confetti-container');
      container.innerHTML = '';
      const colors = ['#F87171', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA', '#F472B6'];

      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = `${2.5 + Math.random() * 2.5}s`;
        piece.style.animationDelay = `${Math.random() * 2}s`;
        container.appendChild(piece);
      }
    }

    /* ==========================================================================
       8. INITIALIZATION & EVENT LISTENERS
       ========================================================================== */
    document.getElementById('play-again-btn').addEventListener('click', () => {
      initGame();
    });

    // Sound toggle button
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });

    // Start on load
    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });
  </script>
</body>
