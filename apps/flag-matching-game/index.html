<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flag Match</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>" />
  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-pastel: #F4F7F6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-pastel);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      overscroll-behavior: none;
      color: #2D3748;
    }

    /* Flag card frame */
    .flag-card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    .flag-svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 1rem;
    }

    .flag-svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 0.85rem;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
    }

    /* Massive Touch Buttons */
    .btn-option {
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .btn-option:active:not(:disabled) {
      transform: scale(0.96);
    }

    /* Gentle Shake on Incorrect */
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .shake-anim {
      animation: gentleShake 0.4s ease-in-out;
    }

    /* Snake Segment Pop-in */
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .segment-pop {
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Momma Snake on Nest Animations */
    @keyframes nestWiggle {
      0% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-5px) rotate(-1.5deg); }
      50% { transform: translateY(0px) rotate(0deg); }
      75% { transform: translateY(-5px) rotate(1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }

    @keyframes headNod {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(3deg) scale(1.02); }
    }

    @keyframes heartFloat {
      0%, 100% { transform: translateY(0px) scale(0.92); opacity: 0.8; }
      50% { transform: translateY(-7px) scale(1.08); opacity: 1; }
    }

    .nest-svg {
      animation: nestWiggle 2s ease-in-out infinite;
    }
    .nest-tail {
      animation: tailWag 1.1s ease-in-out infinite alternate;
    }
    .nest-head {
      animation: headNod 2s ease-in-out infinite alternate;
    }
    .nest-hearts {
      animation: heartFloat 2s ease-in-out infinite;
    }
  </style>
</head>

          <!-- Dynamic text e.g. "Which country is this flag?" or "Find the flag for:" -->
        </h2>
        <div id="prompt-content" class="flex items-center justify-center gap-2 min-h-[50px]">
          <!-- Injected dynamically: either Big Name text or Big Flag SVG -->
        </div>
      </div>

      <!-- Options Container (3 Choices) -->

      </div>

      <!-- Encouraging Feedback Message -->

        <!-- Text like "Great Job! ⭐" -->

        svg: `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#C1272D"/><polygon points="150,44 163,86 207,86 172,112 185,154 150,128 115,154 128,112 93,86 137,86" fill="none" stroke="#006233" stroke-width="8" stroke-linejoin="round"/></svg>`
      },
      {
        id: 'brazil',
        name: 'Brazil',
        svg: `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#009739"/><polygon points="150,22 280,100 150,178 20,100" fill="#FEDD00"/><circle cx="150" cy="100" r="48" fill="#012169"/><path d="M 103 108 Q 150 80 197 104" fill="none" stroke="#FFFFFF" stroke-width="7"/><g fill="#FFFFFF"><circle cx="150" cy="120" r="3"/><circle cx="136" cy="126" r="2.5"/><circle cx="164" cy="124" r="2.5"/><circle cx="144" cy="134" r="2.2"/><circle cx="156" cy="133" r="2"/></g></svg>`
      },
      {
        id: 'portugal',
        name: 'Portugal',
        svg: `<svg viewBox="0 0 300 200"><rect width="120" height="200" fill="#046A38"/><rect x="120" width="180" height="200" fill="#DA291C"/><g transform="translate(120, 100)"><circle r="38" fill="#FEDD00" stroke="#B49800" stroke-width="3"/><ellipse rx="38" ry="18" fill="none" stroke="#B49800" stroke-width="2.5"/><ellipse rx="18" ry="38" fill="none" stroke="#B49800" stroke-width="2.5"/><path d="M-18,-20 L18,-20 L18,12 Q18,28 0,34 Q-18,28 -18,12 Z" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/><path d="M-10,-12 L10,-12 L10,8 Q10,18 0,22 Q-10,18 -10,8 Z" fill="#002B7F"/><circle cx="0" cy="0" r="3" fill="#FFFFFF"/><circle cx="-5" cy="-6" r="2" fill="#FFFFFF"/><circle cx="5" cy="-6" r="2" fill="#FFFFFF"/><circle cx="-5" cy="6" r="2" fill="#FFFFFF"/><circle cx="5" cy="6" r="2" fill="#FFFFFF"/></g></svg>`
      }
    ];

    /* ==========================================================================
       2. GENTLE WEB AUDIO SYNTHESIS (Zero External Assets)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Soft, uplifting 3-note chime for correct answers
    function playSoftChime() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const freqs = [523.25, 659.25, 783.99]; // C5, E5, G5
      const now = ctx.currentTime;

      freqs.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);

        gain.gain.setValueAtTime(0, now + idx * 0.08);
        gain.gain.linearRampToValueAtTime(0.18, now + idx * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.55);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.6);
      });
    }

    // Ultra-soft, gentle low water/wood tap for wrong answers (No harsh buzzers!)
    function playGentleTap() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);

      gain.gain.setValueAtTime(0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.09);
    }

    // Joyful celebration fanfare when Momma Snake reaches 11 segments
    function playWinFanfare() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      const now = ctx.currentTime;

      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.11);

        gain.gain.setValueAtTime(0, now + idx * 0.11);
        gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.11 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 0.75);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + idx * 0.11);
        osc.stop(now + idx * 0.11 + 0.8);
      });
    }

    // Speech synthesis helper to sound out country name
    function speakCountryName(text) {
      if ('speechSynthesis' in window && soundEnabled) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.88; // Slightly slower, great for 4yo
          utterance.pitch = 1.1;
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          // Ignore if unsupported or blocked
        }
      }
    }

    /* ==========================================================================
       3. GAME STATE & SPACED REPETITION ENGINE
       ========================================================================== */
    const TARGET_WINS = 11;
    let score = 0;
    let countryQueue = [];
    let currentQuestion = null;
    let isFirstTryOnCurrent = true;
    let isAnswerLocked = false;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initGame() {
      score = 0;
      isAnswerLocked = false;
      countryQueue = shuffle(COUNTRIES);
      renderSnakeTrack();
      document.getElementById('win-modal').classList.add('hidden');
      loadNextQuestion();
    }

    function loadNextQuestion() {
      if (score >= TARGET_WINS) {
        showWinScreen();
        return;
      }

      // If queue is running low, replenish with more shuffled countries
      if (countryQueue.length === 0) {
        countryQueue = shuffle(COUNTRIES);
      }

      const targetCountry = countryQueue.shift();
      isFirstTryOnCurrent = true;
      isAnswerLocked = false;

      // Pick 2 random distractor countries
      const otherCountries = COUNTRIES.filter(c => c.id !== targetCountry.id);
      const shuffledOthers = shuffle(otherCountries);
      const distractors = [shuffledOthers[0], shuffledOthers[1]];

      // 50/50 Question Type:
      // Type A: 1 Flag prompt, 3 Name options
      // Type B: 1 Name prompt, 3 Flag options
      const questionType = Math.random() < 0.5 ? 'typeA' : 'typeB';

      const options = shuffle([targetCountry, ...distractors]);

      currentQuestion = {
        type: questionType,
        target: targetCountry,
        options: options
      };

      renderQuestion(currentQuestion);
    }

    /* ==========================================================================
       4. UI RENDERING
       ========================================================================== */
    const promptHeader = document.getElementById('prompt-header');
    const promptLabel = document.getElementById('prompt-label');
    const promptContent = document.getElementById('prompt-content');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBar = document.getElementById('feedback-bar');

    function renderQuestion(q) {
      feedbackBar.style.opacity = '0';
      feedbackBar.textContent = '';
      optionsContainer.innerHTML = '';

      if (q.type === 'typeA') {
        // TYPE A: 1 Flag Prompt -> 3 Name Options
        promptLabel.textContent = 'Which country is this flag?';
        promptContent.innerHTML = `
          <div class="w-44 h-28 sm:w-56 sm:h-36 bg-white rounded-2xl p-1.5 flag-card-shadow border-2 border-slate-200/80 transform hover:scale-105 transition-transform duration-200">
            <div class="flag-svg-container">
              ${q.target.svg}
            </div>
          </div>
        `;

        // 3 Name buttons
        q.options.forEach((country) => {
          const btn = document.createElement('button');
          btn.className = `btn-option w-full sm:flex-1 py-3.5 px-3 bg-slate-50 hover:bg-white text-slate-800 font-extrabold text-xl sm:text-2xl rounded-2xl border-4 border-slate-200 shadow-sm flex items-center justify-center gap-2 min-h-[72px] sm:min-h-[80px]`;
          btn.innerHTML = `
            <span>${country.name}</span>
          `;
          btn.onclick = () => handleChoice(country, btn);
          optionsContainer.appendChild(btn);
        });

      } else {
        // TYPE B: 1 Name Prompt -> 3 Flag Options
        promptLabel.textContent = 'Find the flag for:';
        promptContent.innerHTML = `
          <div class="inline-flex items-center gap-2 bg-emerald-100/80 border-2 border-emerald-300 text-emerald-900 px-5 py-2 rounded-2xl shadow-sm">
            <span class="text-2xl sm:text-3xl font-black tracking-wide">${q.target.name}</span>
            <button id="tts-btn" class="w-8 h-8 rounded-full bg-white text-emerald-800 flex items-center justify-center text-sm shadow hover:bg-emerald-50 active:scale-90" title="Sound out name">
              🗣️
            </button>
          </div>
        `;

        document.getElementById('tts-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          speakCountryName(q.target.name);
        });

        // 3 Flag buttons
        q.options.forEach((country) => {
          const btn = document.createElement('button');
          btn.className = `btn-option w-full sm:flex-1 p-1.5 bg-slate-50 hover:bg-white rounded-2xl border-4 border-slate-200 shadow-sm flex items-center justify-center min-h-[90px] sm:min-h-[110px]`;
          btn.innerHTML = `
            <div class="w-full h-20 sm:h-24 flag-svg-container pointer-events-none">
              ${country.svg}
            </div>
          `;
          btn.onclick = () => handleChoice(country, btn);
          optionsContainer.appendChild(btn);
        });
      }
    }

    /* ==========================================================================
       5. INTERACTION & SPACED REPETITION LOGIC
       ========================================================================== */
    function handleChoice(selectedCountry, btnElement) {
      if (isAnswerLocked) return;

      // Resume audio context on user interaction
      getAudioCtx();

      const isCorrect = selectedCountry.id === currentQuestion.target.id;

      if (isCorrect) {
        // --- CORRECT ANSWER ---
        isAnswerLocked = true;
        playSoftChime();

        // Highlight correct button
        btnElement.classList.remove('bg-slate-50', 'border-slate-200', 'hover:bg-white');
        btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'ring-4', 'ring-emerald-300/60');
        
        // Positive feedback message
        feedbackBar.textContent = '🌟 Yes! Awesome job!';
        feedbackBar.className = 'h-8 mt-3 sm:mt-4 flex items-center justify-center font-black text-xl text-emerald-600 transition-opacity duration-200 opacity-100';

        // Increment score & Momma snake length
        score++;
        renderSnakeTrack(true);

        // Delay 1.5s before next question
        setTimeout(() => {
          loadNextQuestion();
        }, 1500);

      } else {
        // --- INCORRECT ANSWER ---
        playGentleTap();

        // Gentle soft red highlight + gentle CSS shake
        btnElement.classList.remove('bg-slate-50', 'border-slate-200');
        btnElement.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-800', 'shake-anim');
        btnElement.disabled = true;

        // Remove shake class after animation completes so it can shake again if retriggered
        setTimeout(() => {
          btnElement.classList.remove('shake-anim');
        }, 450);

        // Feedback prompt
        feedbackBar.textContent = 'Almost! Try another one! 🌱';
        feedbackBar.className = 'h-8 mt-3 sm:mt-4 flex items-center justify-center font-bold text-base text-rose-500 transition-opacity duration-200 opacity-100';

        // Spaced Repetition Rule:
        // "If incorrect on first try, re-insert country 2 steps back in queue."
        if (isFirstTryOnCurrent) {
          isFirstTryOnCurrent = false;
          const reinsertIndex = Math.min(2, countryQueue.length);
          countryQueue.splice(reinsertIndex, 0, currentQuestion.target);
        }
      }
    }

    /* ==========================================================================
       6. MOMMA SNAKE PROGRESS DISPLAY (Compact, Guaranteed Mobile Fit)
       All 13 segments visible: Head + 11 body slots (filled or grayed out) + Tail
       ========================================================================== */
    const snakeTrack = document.getElementById('snake-track');

    function createSnakeHead() {
      const head = document.createElement('div');
      head.className = `relative w-6 h-6 min-[360px]:w-7 min-[360px]:h-7 sm:w-8 sm:h-8 rounded-full bg-emerald-500 border-2 border-emerald-600 shadow-xs flex items-center justify-center shrink-0 z-10`;
      head.innerHTML = `
        <!-- Cute Eyes -->
        <div class="absolute top-1 left-1 sm:top-1.5 sm:left-1.5 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-white rounded-full flex items-center justify-center">
          <div class="w-1 h-1 bg-slate-900 rounded-full"></div>
        </div>
        <div class="absolute top-1 right-1 sm:top-1.5 sm:right-1.5 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-white rounded-full flex items-center justify-center">
          <div class="w-1 h-1 bg-slate-900 rounded-full"></div>
        </div>
        <!-- Blush cheeks -->
        <div class="absolute top-2.5 left-0.5 w-1 h-0.5 sm:w-1.5 sm:h-1 bg-rose-300 rounded-full"></div>
        <div class="absolute top-2.5 right-0.5 w-1 h-0.5 sm:w-1.5 sm:h-1 bg-rose-300 rounded-full"></div>
        <!-- Smile & Cute Tongue -->
        <div class="absolute bottom-0.5 sm:bottom-1 flex flex-col items-center">
          <div class="w-2 h-1 border-b-2 border-emerald-800 rounded-full"></div>
          <div class="w-1 h-1 bg-pink-400 rounded-b-full"></div>
        </div>
      `;
      return head;
    }

    function createSnakeTail() {
      const tail = document.createElement('div');
      tail.className = `w-5 h-5 min-[360px]:w-5.5 min-[360px]:h-5.5 sm:w-6 sm:h-6 rounded-full bg-emerald-600 border-2 border-emerald-700 shadow-xs shrink-0 flex items-center justify-center`;
      tail.innerHTML = `<div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>`;
      return tail;
    }

    function createBodySlot(slotIndex, isFilled, isNewlyFilled = false) {
      const seg = document.createElement('div');
      
      if (isFilled) {
        // Bright emerald filled segment
        const popClass = isNewlyFilled ? 'segment-pop' : '';
        seg.className = `w-5 h-5 min-[360px]:w-6 min-[360px]:h-6 sm:w-7 sm:h-7 rounded-full bg-gradient-to-tr from-emerald-500 to-green-400 border-2 border-emerald-600 shadow-xs shrink-0 flex items-center justify-center ${popClass}`;
        seg.innerHTML = `<div class="w-1.5 h-1.5 rounded-full bg-yellow-200/90 shadow-xs"></div>`;
      } else {
        // Grayed-out / dashed progress placeholder slot
        seg.className = `w-5 h-5 min-[360px]:w-6 min-[360px]:h-6 sm:w-7 sm:h-7 rounded-full bg-slate-200/50 border-2 border-dashed border-slate-300/80 shadow-xs shrink-0 flex items-center justify-center opacity-70`;
        seg.innerHTML = `<div class="w-1 h-1 rounded-full bg-slate-300"></div>`;
      }
      return seg;
    }

    function renderSnakeTrack(justIncremented = false) {
      snakeTrack.innerHTML = '';

      // 1. Head
      snakeTrack.appendChild(createSnakeHead());

      // 2. 11 Body slots: filled if i <= score, grayed out if i > score
      for (let i = 1; i <= TARGET_WINS; i++) {
        const isFilled = i <= score;
        const isNewlyFilled = justIncremented && (i === score);
        snakeTrack.appendChild(createBodySlot(i, isFilled, isNewlyFilled));
      }

      // 3. Tail
      snakeTrack.appendChild(createSnakeTail());
    }

    /* ==========================================================================
       7. WIN SCREEN & CELEBRATION (Momma Snake on a Nest)
       ========================================================================== */
    function showWinScreen() {
      playWinFanfare();
      const winModal = document.getElementById('win-modal');
      winModal.classList.remove('hidden');
    }

    /* ==========================================================================
       8. INITIALIZATION & EVENT LISTENERS
       ========================================================================== */
    document.getElementById('play-again-btn').addEventListener('click', () => {
      initGame();
    });

    // Sound toggle button
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });

    // Start on load
    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });
  </script>
