<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="yolk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner border ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#fef3c7" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Pan graphic -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M 190 315 L 108 397 C 98 407 82 407 72 397 C 62 387 62 371 72 361 L 154 279 Z" fill="url(#pan)" />
    <circle cx="92" cy="377" r="9" fill="#f59e0b" opacity="0.85"/>

    <!-- Skillet body -->
    <circle cx="295" cy="225" r="132" fill="url(#pan)"/>
    <circle cx="295" cy="225" r="116" fill="#1e293b"/>
    <circle cx="295" cy="225" r="108" fill="#0f172a"/>

    <!-- Fried Egg Whites -->
    <path d="M 275 165 C 328 155 360 188 365 220 C 370 252 342 280 305 284 C 268 288 238 266 234 238 C 230 205 248 170 275 165 Z" fill="#ffffff" />
    
    <!-- Egg Yolk -->
    <circle cx="295" cy="225" r="35" fill="url(#yolk)"/>
    <!-- Highlight -->
    <ellipse cx="284" cy="214" rx="10" ry="6" fill="#ffffff" opacity="0.65" transform="rotate(-30 284 214)"/>

    <!-- Garnish herbs -->
    <circle cx="258" cy="198" r="3" fill="#16a34a"/>
    <circle cx="338" cy="212" r="3" fill="#16a34a"/>
    <circle cx="310" cy="265" r="3" fill="#16a34a"/>
    <circle cx="268" cy="254" r="2.5" fill="#16a34a"/>
  </g>

  <!-- Steam curls -->
  <path d="M 265 110 Q 255 88 268 70 Q 280 52 272 34" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 320 115 Q 310 92 324 74 Q 338 56 328 38" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
</svg>
