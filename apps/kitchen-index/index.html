<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Kitchen Index — Family Recipe Archive</title>
  <meta name="description" content="Tested ingredient ratios, baker's percentages, temperatures, and concise kitchen techniques." />

  <!-- PWA & Mobile Web Capabilities -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#d97706" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kitchen Index" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Search & Filter Bar (Zero Fluff, Instant Access) -->
    <header class="search-filter-bar">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Search recipes, ingredients, techniques..." 
          autocomplete="off"
          aria-label="Search recipes"
        />
        <button id="search-clear-btn" class="search-clear-btn" aria-label="Clear search" style="display: none;">✕</button>
      </div>

      <button id="btn-open-filters" class="btn-filter" aria-label="Open recipe filters" title="Filter by tags">
        <span class="filter-icon" aria-hidden="true">⚙️</span>
        <span class="filter-label">Filters</span>
        <span id="filter-badge" class="filter-badge" style="display: none;">0</span>
      </button>
    </header>

    <!-- Sub-bar with Counts & Tree Controls -->
    <div class="tree-controls-bar">
      <div class="results-count" id="results-count">Loading recipes…</div>
      <div class="tree-actions">
        <button class="btn-tree-toggle" id="btn-toggle-all-tree" title="Expand or collapse all categories">
          Expand All
        </button>
        <button class="btn-text-reset" id="btn-reset-filters" style="display: none;">
          Clear Filters
        </button>
      </div>
    </div>

    <!-- Collapsible Category Accordion Tree -->
    <main class="category-tree" id="category-tree" aria-label="Recipe categories tree" role="tree">
      <!-- Categories and compact recipe rows rendered dynamically via app.js -->
    </main>
  </div>

  <!-- Detailed Recipe View Modal -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="recipe-modal" id="modal-container">
      <!-- Modal contents rendered dynamically via app.js -->
    </div>
  </div>

  <!-- Dedicated Filters Dialog / Modal -->
  <div class="modal-backdrop" id="filter-modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="filter-dialog" id="filter-dialog-container">
      <div class="filter-dialog-header">
        <h2>Filter by Tags</h2>
        <button class="modal-close-btn" id="filter-modal-close-btn" title="Close" aria-label="Close filters">✕</button>
      </div>

      <div class="filter-dialog-body">
        <!-- Tags Filter -->
        <div class="filter-section">
          <div class="filter-section-title">Tags</div>
          <div class="filter-options-grid" id="modal-tags-grid">
            <!-- Populated dynamically via app.js -->
          </div>
        </div>
      </div>

      <div class="filter-dialog-footer">
        <button class="btn btn-secondary" id="btn-modal-reset-all">Reset All</button>
        <button class="btn btn-primary" id="btn-modal-apply">Apply Filters</button>
      </div>
    </div>
  </div>

  <!-- In-App Toast Notification -->
  <div class="toast-container" id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Recipe Data & Application Logic -->
  <script src="./recipes.js"></script>
  <script src="./app.js"></script>
</body>
</html>
