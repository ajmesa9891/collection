<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apps</title>

  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apps" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: max(2rem, env(safe-area-inset-top)) max(2rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(2rem, env(safe-area-inset-left));
      line-height: 1.6;
      background-color: #ffffff;
    }
    ul {
      list-style-type: square;
      padding-left: 1.5rem;
      margin: 0;
    }
    li {
      margin-bottom: 0.35rem;
    }
    a {
      color: #0000ee;
      text-decoration: underline;
    }
    a:visited {
      color: #551a8b;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="apps/green-light-red-light-game/">Green Light, Red Light</a></li>
    <li><a href="apps/toddler-snake-timer/">Toddler Snake Timer</a></li>
    <li><a href="apps/flag-matching-game/">Flag Match (Momma Snake)</a></li>
    <li><a href="apps/flag-racecar-game/">Flag Racer (Grand Prix Track)</a></li>
    <li><a href="apps/_template-react-tailwind/">React + Tailwind Template</a></li>
  </ul>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
