    <circle cx="-8" cy="-5" r="5" fill="#0f172a"/><circle cx="8" cy="-5" r="5" fill="#0f172a"/>
    <path d="M -7 7 Q 0 14 7 7" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
