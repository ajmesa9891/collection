<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#4ade80"/>
  <!-- Outer Grand Prix Track -->
  <rect x="30" y="30" width="340" height="340" rx="76" fill="none" stroke="#334155" stroke-width="46"/>
  <rect x="30" y="30" width="340" height="340" rx="76" fill="none" stroke="#facc15" stroke-width="5" stroke-dasharray="18 16"/>
  <!-- Checkered Finish Strip -->
  <g transform="translate(178,8)">
    <rect width="12" height="12" fill="#fff"/><rect x="12" width="12" height="12" fill="#0f172a"/><rect x="24" width="12" height="12" fill="#fff"/>
    <rect y="12" width="12" height="12" fill="#0f172a"/><rect x="12" y="12" width="12" height="12" fill="#fff"/><rect x="24" y="12" width="12" height="12" fill="#0f172a"/>
    <rect y="24" width="12" height="12" fill="#fff"/><rect x="12" y="24" width="12" height="12" fill="#0f172a"/><rect x="24" y="24" width="12" height="12" fill="#fff"/>
    <rect y="36" width="12" height="12" fill="#0f172a"/><rect x="12" y="36" width="12" height="12" fill="#fff"/><rect x="24" y="36" width="12" height="12" fill="#0f172a"/>
  </g>
  <!-- Center Colorful World Flags -->
  <!-- Japan -->
  <g transform="translate(105,105)">
    <rect width="78" height="54" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
    <circle cx="39" cy="27" r="15" fill="#ef4444"/>
  </g>
  <!-- Brazil -->
  <g transform="translate(216,105)">
    <rect width="78" height="54" rx="10" fill="#22c55e" stroke="#ffffff" stroke-width="4"/>
    <polygon points="39,8 68,27 39,46 10,27" fill="#facc15"/>
    <circle cx="39" cy="27" r="10" fill="#2563eb"/>
  </g>
  <!-- France -->
  <g transform="translate(160,174)">
    <rect width="78" height="54" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
    <rect width="26" height="54" rx="6" fill="#2563eb"/>
    <rect x="52" width="26" height="54" rx="6" fill="#ef4444"/>
  </g>
  <!-- Cute Red Formula Racecar -->
  <g transform="translate(200,322)">
    <rect x="-78" y="-26" width="156" height="46" rx="22" fill="#ef4444" stroke="#ffffff" stroke-width="5"/>
    <circle cx="4" cy="-14" r="19" fill="#facc15" stroke="#ffffff" stroke-width="4"/>
    <circle cx="11" cy="-16" r="5" fill="#0f172a"/>
    <rect x="-86" y="-34" width="22" height="14" rx="4" fill="#ffffff"/>
    <circle cx="-46" cy="20" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <circle cx="46" cy="20" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
