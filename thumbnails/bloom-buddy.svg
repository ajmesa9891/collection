    <circle r="54" fill="#92400e" stroke="#ffffff" stroke-width="6"/>
    <circle cx="-18" cy="-8" r="10" fill="#ffffff"/><circle cx="-16" cy="-8" r="5" fill="#0f172a"/>
    <circle cx="18" cy="-8" r="10" fill="#ffffff"/><circle cx="20" cy="-8" r="5" fill="#0f172a"/>
