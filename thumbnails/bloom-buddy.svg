      <ellipse rx="24" ry="48" transform="rotate(225) translate(0,-64)"/>
      <ellipse rx="24" ry="48" transform="rotate(270) translate(0,-64)"/>
      <ellipse rx="24" ry="48" transform="rotate(315) translate(0,-64)"/>
