      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#garden)"/>
  <!-- Four-Season Wheel Background Ring -->
  <circle cx="200" cy="200" r="150" fill="#ffffff" opacity="0.25"/>
  <path d="M200,200 L200,56 A144,144 0 0,1 344,200 Z" fill="#f472b6" opacity="0.85"/>
  <path d="M200,200 L344,200 A144,144 0 0,1 200,344 Z" fill="#facc15" opacity="0.9"/>
