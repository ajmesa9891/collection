    <rect x="22" y="104" width="68" height="9" rx="4" fill="#cbd5e1"/>
    <!-- Right Page Cute Pie Icon -->
    <circle cx="202" cy="86" r="40" fill="#fde047" stroke="#f59e0b" stroke-width="6"/>
    <path d="M 176 86 Q 202 64 228 86" fill="none" stroke="#b45309" stroke-width="5"/>
