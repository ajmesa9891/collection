      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#warm)"/>
  <!-- Cozy Table -->
  <rect y="275" width="400" height="125" fill="#92400e"/>
  <rect y="275" width="400" height="14" fill="#b45309"/>
  <!-- Open Recipe Book -->
