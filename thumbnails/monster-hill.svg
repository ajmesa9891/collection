<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- Rolling Green Hills -->
  <path d="M 0 320 Q 110 210 210 295 T 400 260 L 400 400 L 0 400 Z" fill="#4ade80"/>
  <path d="M 0 330 Q 110 220 210 305 T 400 270" fill="none" stroke="#16a34a" stroke-width="14"/>
  <!-- Floating Stars -->
  <polygon points="300,115 308,133 328,135 313,148 317,168 300,157 283,168 287,148 272,135 292,133" fill="#facc15" stroke="#ffffff" stroke-width="4"/>
  <polygon points="92,102 98,116 113,118 102,128 105,143 92,135 79,143 82,128 71,118 86,116" fill="#fde047" stroke="#ffffff" stroke-width="3"/>
  <!-- Chunky Red Monster Truck Jumping -->
  <g transform="translate(195,215) rotate(-15)">
    <!-- Suspension Struts -->
    <line x1="-64" y1="22" x2="-64" y2="52" stroke="#facc15" stroke-width="10"/>
    <line x1="64" y1="22" x2="64" y2="52" stroke="#facc15" stroke-width="10"/>
    <!-- Body -->
    <rect x="-94" y="-26" width="188" height="54" rx="16" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
    <path d="M -52,-26 L -32,-68 L 42,-68 L 62,-26 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="6"/>
    <rect x="-86" y="-4" width="172" height="12" rx="6" fill="#facc15"/>
    <!-- Giant Monster Wheels -->
    <circle cx="-64" cy="54" r="42" fill="#1e293b" stroke="#ffffff" stroke-width="6"/>
    <circle cx="-64" cy="54" r="18" fill="#facc15"/>
    <circle cx="64" cy="54" r="42" fill="#1e293b" stroke="#ffffff" stroke-width="6"/>
    <circle cx="64" cy="54" r="18" fill="#facc15"/>
  </g>
</svg>
