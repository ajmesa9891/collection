<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gateBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gateGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Sky & Meadow -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="70" cy="65" r="28" fill="#ffffff" opacity="0.85"/>
  <circle cx="95" cy="58" r="22" fill="#ffffff" opacity="0.85"/>
  <circle cx="325" cy="70" r="24" fill="#ffffff" opacity="0.8"/>
  <rect y="190" width="400" height="210" fill="#4ade80"/>
  <!-- Perspective Track -->
  <polygon points="135,190 265,190 365,400 35,400" fill="url(#road)" stroke="#f59e0b" stroke-width="8"/>
  <line x1="200" y1="195" x2="200" y2="395" stroke="#fcd34d" stroke-width="6" stroke-dasharray="18 14"/>
  <!-- Toy Castle in Background -->
  <g transform="translate(155,112)">
    <rect x="14" y="28" width="62" height="50" rx="6" fill="#9333ea"/>
    <rect x="0" y="18" width="22" height="60" rx="4" fill="#a855f7"/>
    <rect x="68" y="18" width="22" height="60" rx="4" fill="#a855f7"/>
    <polygon points="-3,18 11,-4 25,18" fill="#facc15"/>
    <polygon points="65,18 79,-4 93,18" fill="#facc15"/>
    <rect x="34" y="48" width="22" height="30" rx="10" fill="#78350f"/>
  </g>
  <!-- Gates -->
  <g transform="translate(76,178)">
    <rect width="108" height="92" rx="14" fill="url(#gateBlue)" stroke="#ffffff" stroke-width="6" opacity="0.94"/>
    <text x="54" y="54" font-family="Arial Rounded MT Bold, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle">+4</text>
    <circle cx="28" cy="74" r="6" fill="#fef08a"/>
    <circle cx="45" cy="74" r="6" fill="#fef08a"/>
    <circle cx="63" cy="74" r="6" fill="#fef08a"/>
    <circle cx="80" cy="74" r="6" fill="#fef08a"/>
  </g>
  <g transform="translate(216,178)">
    <rect width="108" height="92" rx="14" fill="url(#gateGold)" stroke="#ffffff" stroke-width="6" opacity="0.94"/>
    <text x="54" y="56" font-family="Arial Rounded MT Bold, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">×2</text>
    <text x="54" y="79" font-family="Arial Rounded MT Bold, sans-serif" font-weight="900" font-size="14" fill="#fef08a" text-anchor="middle">★ DOUBLE ★</text>
  </g>
  <!-- Squad of 3 Cute Blue Bots -->
  <g transform="translate(118,288)">
    <ellipse cx="30" cy="84" rx="22" ry="7" fill="rgba(0,0,0,0.18)"/>
    <rect x="10" y="34" width="40" height="44" rx="14" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
    <circle cx="30" cy="24" r="22" fill="#3b82f6" stroke="#ffffff" stroke-width="4"/>
    <rect x="16" y="16" width="28" height="12" rx="6" fill="#38bdf8"/>
    <circle cx="30" cy="-4" r="6" fill="#facc15"/>
  </g>
  <g transform="translate(222,288)">
    <ellipse cx="30" cy="84" rx="22" ry="7" fill="rgba(0,0,0,0.18)"/>
    <rect x="10" y="34" width="40" height="44" rx="14" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
    <circle cx="30" cy="24" r="22" fill="#3b82f6" stroke="#ffffff" stroke-width="4"/>
    <rect x="16" y="16" width="28" height="12" rx="6" fill="#38bdf8"/>
    <circle cx="30" cy="-4" r="6" fill="#facc15"/>
  </g>
  <g transform="translate(166,296) scale(1.15)">
    <ellipse cx="30" cy="84" rx="24" ry="8" fill="rgba(0,0,0,0.2)"/>
    <rect x="10" y="34" width="40" height="44" rx="14" fill="#1d4ed8" stroke="#ffffff" stroke-width="4"/>
    <circle cx="30" cy="24" r="22" fill="#3b82f6" stroke="#ffffff" stroke-width="4"/>
    <rect x="15" y="15" width="30" height="13" rx="6" fill="#7dd3fc"/>
    <line x1="30" y1="2" x2="30" y2="-8" stroke="#ffffff" stroke-width="4"/>
    <circle cx="30" cy="-10" r="7" fill="#facc15"/>
  </g>
</svg>
