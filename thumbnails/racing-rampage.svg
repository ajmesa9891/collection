<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- Sunset Sun -->
  <circle cx="200" cy="185" r="88" fill="#fef08a" opacity="0.85"/>
  <!-- Highway -->
  <polygon points="90,235 310,235 400,400 0,400" fill="#1e293b"/>
  <line x1="200" y1="240" x2="200" y2="395" stroke="#facc15" stroke-width="8" stroke-dasharray="22 16"/>
  <!-- Stunt Ramp -->
  <polygon points="45,355 245,255 245,355" fill="#334155" stroke="#f97316" stroke-width="6"/>
  <!-- Turbo Flames -->
  <polygon points="88,238 22,272 68,268 35,302 108,266" fill="#facc15"/>
  <polygon points="94,244 48,270 84,268 62,290 108,262" fill="#f97316"/>
  <!-- Red Stunt Racecar Launching -->
  <g transform="translate(215,195) rotate(-22)">
    <rect x="-102" y="-22" width="204" height="58" rx="18" fill="url(#carRed)" stroke="#ffffff" stroke-width="5"/>
    <path d="M -52,-22 L -28,-58 L 36,-58 L 62,-22 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="5"/>
    <rect x="-108" y="-44" width="26" height="12" rx="4" fill="#facc15"/>
    <line x1="-88" y1="-32" x2="-82" y2="-18" stroke="#0f172a" stroke-width="6"/>
    <!-- Stripes -->
    <rect x="-95" y="2" width="190" height="10" fill="#facc15"/>
    <!-- Wheels -->
    <circle cx="-58" cy="36" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="-58" cy="36" r="12" fill="#94a3b8"/>
    <circle cx="60" cy="36" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="60" cy="36" r="12" fill="#94a3b8"/>
  </g>
  <!-- Action Sparks -->
  <polygon points="328,88 336,108 358,110 341,124 346,146 328,134 310,146 315,124 298,110 320,108" fill="#fef08a" stroke="#f97316" stroke-width="3"/>
</svg>
