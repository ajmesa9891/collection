<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Solid background for maskable compatibility -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Central Icon Grid within Safe Zone (80% circle, r=204) -->
  <g filter="url(#shadow)">
    <!-- Top-Left Tile: Game / Reaction -->
    <rect x="136" y="136" width="104" height="104" rx="26" fill="#ffffff" fill-opacity="0.95" />
    <!-- Gamepad / Circle symbol -->
    <circle cx="188" cy="188" r="24" fill="#22c55e" />

    <!-- Top-Right Tile: Timer -->
    <rect x="272" y="136" width="104" height="104" rx="26" fill="#ffffff" fill-opacity="0.95" />
    <!-- Timer hand symbol -->
    <circle cx="324" cy="188" r="24" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    <line x1="324" y1="188" x2="324" y2="174" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <line x1="324" y1="188" x2="334" y2="188" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

    <!-- Bottom-Left Tile: Code / Template -->
    <rect x="136" y="272" width="104" height="104" rx="26" fill="#ffffff" fill-opacity="0.95" />
    <!-- Brackets symbol -->
    <path d="M 178 312 L 168 324 L 178 336 M 198 312 L 208 324 L 198 336" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom-Right Tile: Star / App -->
    <rect x="272" y="272" width="104" height="104" rx="26" fill="#ffffff" fill-opacity="0.95" />
    <!-- Sparkle / Star symbol -->
    <path d="M 324 306 L 328 320 L 342 324 L 328 328 L 324 342 L 320 328 L 306 324 L 320 320 Z" fill="#ec4899" />
  </g>
</svg>
